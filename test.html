<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆翻牌游戏 - Phaser实现</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #3a7bd5, #00d2ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .header {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #FFD700, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .game-content {
            display: flex;
            flex-wrap: wrap;
        }
        
        #game-canvas {
            flex: 1;
            min-width: 300px;
            background-color: rgba(0, 0, 0, 0.2);
        }
        
        .game-ui {
            width: 300px;
            background: rgba(0, 0, 0, 0.5);
            padding: 25px;
            color: white;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, background 0.3s;
        }
        
        .stat-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .controls {
            margin-bottom: 30px;
        }
        
        .controls h3, .instructions h3 {
            margin-bottom: 15px;
            color: #FFD700;
            font-size: 1.3rem;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        button {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        button#reset-btn {
            background: linear-gradient(to right, #FF416C, #FF4B2B);
        }
        
        .instructions ul {
            list-style-type: none;
            padding-left: 5px;
        }
        
        .instructions li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .instructions li:before {
            content: "★";
            color: #FFD700;
            margin-right: 10px;
        }
        
        .footer {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.9rem;
        }
        
        .card-back-sample {
            width: 50px;
            height: 70px;
            background: linear-gradient(135deg, #1a2a6c, #3a7bd5);
            border-radius: 8px;
            display: inline-block;
            vertical-align: middle;
            margin: 0 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .card-front-sample {
            width: 50px;
            height: 70px;
            background: white;
            border-radius: 8px;
            display: inline-block;
            vertical-align: middle;
            margin: 0 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        .card-front-sample:after {
            content: "♠";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #1a2a6c;
        }
        
        @media (max-width: 900px) {
            .game-content {
                flex-direction: column;
            }
            
            .game-ui {
                width: 100%;
            }
            
            #game-canvas {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>记忆翻牌游戏</h1>
            <p>翻开两张牌，找到所有相同的配对。尽可能用最少的步数和最短的时间完成！</p>
        </div>
        
        <div class="game-content">
            <div id="game-canvas"></div>
            
            <div class="game-ui">
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-value" id="moves">0</div>
                        <div class="stat-label">步数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="time">0</div>
                        <div class="stat-label">时间(秒)</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="matches">0</div>
                        <div class="stat-label">已匹配</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="score">0</div>
                        <div class="stat-label">得分</div>
                    </div>
                </div>
                
                <div class="controls">
                    <h3>游戏控制</h3>
                    <div class="buttons">
                        <button id="start-btn">开始游戏</button>
                        <button id="reset-btn">重新开始</button>
                        <button id="easy-btn">简单模式(4x4)</button>
                        <button id="hard-btn">困难模式(6x6)</button>
                    </div>
                </div>
                
                <div class="instructions">
                    <h3>游戏规则</h3>
                    <ul>
                        <li>点击卡牌将其翻开</li>
                        <li>每次只能翻开两张牌</li>
                        <li>如果两张牌相同，则保持翻开状态</li>
                        <li>如果不同，牌会自动翻回去</li>
                        <li>匹配所有卡牌对即可获胜</li>
                        <li>步数越少，时间越短，得分越高</li>
                    </ul>
                </div>
                
                <div style="margin-top: 20px; text-align: center;">
                    <p>卡牌示例: 
                        <span class="card-back-sample"></span> 卡牌背面
                        <span class="card-front-sample"></span> 卡牌正面
                    </p>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>基于Phaser 3实现的记忆翻牌游戏 | 使用HTML5 Canvas和JavaScript</p>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            type: Phaser.AUTO,
            parent: 'game-canvas',
            width: 800,
            height: 600,
            backgroundColor: '#1a1a2e',
            scene: {
                preload: preload,
                create: create,
                update: update
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            }
        };

        // 创建游戏实例
        const game = new Phaser.Game(config);

        // 游戏变量
        let cards = [];
        let flippedCards = [];
        let canFlip = true;
        let totalMatches = 0;
        let moves = 0;
        let startTime = 0;
        let gameTime = 0;
        let gameActive = false;
        let score = 0;
        let gridSize = 4; // 默认4x4网格
        let cardValues = [];
        let cardSprites = [];
        let cardBack;
        let matchSound;
        let flipSound;
        let winSound;
        
        // 预加载资源
        function preload() {
            // 加载卡牌背面纹理
            this.load.image('cardBack', 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAAACXBIWXMAAAsSAAALEgHS3X78AAACuUlEQVR4nO3dS2gTURjA8e9k0qRpaNq0Lx8VxQeKiiIUFxWlKIgPFFEQFcSFC3HjQlwJLtwqLkRcKIoPFFFQqoiKiiCiiA8QH4iK0Fpba5M2zWOa5J5xUe2iLprm3rub3w8CgcDkfOfLzJ07mQwhhBBCCCGEEEIIIYQQQgghhBBCCCGEyBQj7QKyxgLqgW6gB+gE2oE2oBWoB8qAIvADmAXGgVHgAzAAvAUmpbE2lgSgNq3AXuAwsBvwrD9fAWaAGWAKKAK/gN9ABWgC8kADsBFo/tvPZ4HLwDXgCzKDrCsJwNp0ABeBM0AOKAMfgZfAa2AI+AZMANP/C0AZqAB51gLQBLQDO4A9wEFgK2ACr4DTwKCCzxQpkwCsrgW4BpwCcsA4cB+4B7wD5tZ5vA3ATuA4cAwoAE+BE8CwfGXZJAFYyQSuA1eABuANcAa4v87Gr2YbcBu3fFgEjgCPcMtHkSESgJW6gUfANuA7cBS3hEuKAVwCbgB54BFwHJiSqyA7JADLmcAt4CxuiXYCuJvCMzcDuAvcACaBQ8CABCA7JADL9QJPcEPzU+AQ7q5dWvYDD3DLyEPA8xQ+X6yDBGAtAH3APuAXcAB4n3JNTcA93B3GfuCcBCC5I4k1ygG3gT7cHb1e0m884Bb8T3D3J/qA3pTrEf8gAXDyQD9u0nUPuJ5yPf+0EXiIe3bhFm6pKjJAAuBu3PQDR4Ah4FzK9fxLD+4h0w7cQ6J7KdcjkAD81YjTuCeB9wM/Uq7pf/YBz3DPLvYBW1Ou54/3Sf9vJbYHwACeA724p2/7MljncgZuSdkLvAS2ZqCmVyRdQJxHAT3Ac9yQfA53JzDLDOAq7m7jC6An5Xq0JjNATg6o4jZx9GtQcxX3PEOBdL5v6Q4A7q7aV6AHt0Mnq8P/SiZuB9IY0IXbqZQEbQNQAiZwT+l04J6uHUq5nrV6B3Ti9i0MpVnIeJIfnlUAXgHbgV3A5ZTrWY9LuD2Iu3A7lYRaUgBwF/k53O7cEeBiyvWs1UXcDqUR3E4l7cgSoK8i7vGvLbjHv7K0D3A1Bm7T6QjQg9vBlDgJgL6agS+4jR/HcI9/Zd0Ebv9BA+4bUqIkAIDZ8nPvqVlw5mZb8mZ9c4dRKGwyq4Uuw6pvS7u0tRgFOnEbVxLdjiYBAMx8sddq6L5lFbpfm7n6t6ZVeGvVtb6yGlpvmYX2a0ah83DaNa7BDO4h0zrckjEREgDNmYVuK990cN6q73xl5hremlZhwKpv7bMKXc/Sru1fEu9g7R4GWfXtnXbT7lm7rvOVmWt8Z9U1v7cKHSOmmR+2GjsW0q4R3FJwB3AA2A9sBjZR2y6kKjCH27Y+jNuu9hL3hFIi/wYgC8rAbtx/At2B26fXhrtX34jbjVTC7T6aAyaBYdy2tXe4fYhzUgAhhBBCCCGEEEIIIYQQQgghhBBCCCFEFvwBhpN5h5eP3oQAAAAASUVORK5CYII=');
            
            // 加载卡牌正面纹理（使用简单形状和颜色）
            for (let i = 1; i <= 12; i++) {
                const color = getColorForIndex(i);
                const canvas = document.createElement('canvas');
                canvas.width = 100;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');
                
                // 绘制卡牌背景
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, 100, 150);
                
                // 绘制圆角
                ctx.lineJoin = 'round';
                ctx.lineWidth = 8;
                ctx.strokeStyle = color;
                ctx.strokeRect(4, 4, 92, 142);
                
                // 绘制内部形状
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                
                // 根据索引绘制不同形状
                drawShape(ctx, i);
                
                // 将canvas转换为纹理
                this.textures.addCanvas(`card${i}`, canvas);
            }
            
            // 加载声音（使用Phaser的虚拟声音，实际项目中应加载音频文件）
            this.load.audio('flip', 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAA==');
            this.load.audio('match', 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAA==');
            this.load.audio('win', 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAA==');
        }
        
        // 根据索引获取颜色
        function getColorForIndex(index) {
            const colors = [
                '#FF6B6B', '#4ECDC4', '#FFD166', '#06D6A0',
                '#118AB2', '#EF476F', '#1B9AAA', '#FF9A76',
                '#7B68EE', '#20B2AA', '#FFA500', '#9ACD32'
            ];
            return colors[(index - 1) % colors.length];
        }
        
        // 绘制形状
        function drawShape(ctx, index) {
            ctx.save();
            ctx.translate(50, 75);
            
            switch(index % 6) {
                case 0:
                    // 圆形
                    ctx.beginPath();
                    ctx.arc(0, 0, 30, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 1:
                    // 正方形
                    ctx.fillRect(-25, -25, 50, 50);
                    break;
                case 2:
                    // 三角形
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(30, 25);
                    ctx.lineTo(-30, 25);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 3:
                    // 菱形
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(30, 0);
                    ctx.lineTo(0, 30);
                    ctx.lineTo(-30, 0);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 4:
                    // 五角星
                    drawStar(ctx, 0, 0, 5, 30, 15);
                    ctx.fill();
                    break;
                case 5:
                    // 六边形
                    drawHexagon(ctx, 0, 0, 30);
                    ctx.fill();
                    break;
            }
            
            ctx.restore();
        }
        
        // 绘制星星
        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;
            
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }
        
        // 绘制六边形
        function drawHexagon(ctx, x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = Math.PI / 3 * i;
                const px = x + radius * Math.cos(angle);
                const py = y + radius * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.closePath();
        }
        
        // 创建游戏场景
        function create() {
            // 创建声音
            flipSound = this.sound.add('flip');
            matchSound = this.sound.add('match');
            winSound = this.sound.add('win');
            
            // 初始化游戏
            initGame(this);
            
            // 添加开始游戏按钮事件
            document.getElementById('start-btn').addEventListener('click', () => {
                initGame(this);
            });
            
            // 添加重新开始按钮事件
            document.getElementById('reset-btn').addEventListener('click', () => {
                initGame(this);
            });
            
            // 添加简单模式按钮事件
            document.getElementById('easy-btn').addEventListener('click', () => {
                gridSize = 4;
                initGame(this);
            });
            
            // 添加困难模式按钮事件
            document.getElementById('hard-btn').addEventListener('click', () => {
                gridSize = 6;
                initGame(this);
            });
            
            // 初始化UI
            updateUI();
        }
        
        // 初始化游戏
        function initGame(scene) {
            // 重置游戏状态
            cards = [];
            flippedCards = [];
            canFlip = true;
            totalMatches = 0;
            moves = 0;
            startTime = scene.time.now;
            gameTime = 0;
            gameActive = true;
            score = 0;
            cardValues = [];
            cardSprites = [];
            
            // 清除之前的卡牌
            scene.children.removeAll();
            
            // 创建卡牌背面纹理引用
            cardBack = scene.textures.get('cardBack').source[0];
            
            // 生成卡牌对
            const totalCards = gridSize * gridSize;
            const totalPairs = totalCards / 2;
            
            // 生成卡牌值（配对）
            for (let i = 1; i <= totalPairs; i++) {
                // 每对卡牌有相同的值
                const cardType = Math.ceil(i % 12) + 1;
                cardValues.push(cardType, cardType);
            }
            
            // 打乱卡牌顺序
            shuffleArray(cardValues);
            
            // 计算卡牌尺寸和间距
            const cardWidth = 100;
            const cardHeight = 150;
            const horizontalSpacing = 110;
            const verticalSpacing = 160;
            
            // 计算网格起始位置
            const gridWidth = gridSize * horizontalSpacing - 10;
            const gridHeight = gridSize * verticalSpacing - 10;
            const startX = (scene.game.config.width - gridWidth) / 2 + cardWidth / 2;
            const startY = (scene.game.config.height - gridHeight) / 2 + cardHeight / 2;
            
            // 创建卡牌精灵
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const index = row * gridSize + col;
                    const cardValue = cardValues[index];
                    
                    // 创建卡牌精灵
                    const card = scene.add.sprite(
                        startX + col * horizontalSpacing,
                        startY + row * verticalSpacing,
                        'cardBack'
                    ).setInteractive();
                    
                    // 设置卡牌数据
                    card.setData('value', cardValue);
                    card.setData('flipped', false);
                    card.setData('matched', false);
                    card.setData('index', index);
                    
                    // 添加点击事件
                    card.on('pointerdown', function() {
                        flipCard(this, scene);
                    });
                    
                    // 存储卡牌引用
                    cardSprites.push(card);
                    cards.push({
                        sprite: card,
                        value: cardValue,
                        flipped: false,
                        matched: false,
                        index: index
                    });
                }
            }
            
            // 更新UI
            updateUI();
        }
        
        // 翻转卡牌
        function flipCard(card, scene) {
            // 如果游戏未激活或不能翻转，返回
            if (!gameActive || !canFlip || card.getData('flipped') || card.getData('matched')) {
                return;
            }
            
            // 播放翻牌声音
            flipSound.play();
            
            // 翻转卡牌动画
            scene.tweens.add({
                targets: card,
                scaleX: 0,
                duration: 150,
                onComplete: function() {
                    // 显示卡牌正面
                    card.setTexture(`card${card.getData('value')}`);
                    
                    // 继续翻转动画
                    scene.tweens.add({
                        targets: card,
                        scaleX: 1,
                        duration: 150,
                        onComplete: function() {
                            // 将卡牌添加到已翻转数组
                            flippedCards.push(card);
                            card.setData('flipped', true);
                            
                            // 如果翻了两张卡牌，检查是否匹配
                            if (flippedCards.length === 2) {
                                canFlip = false;
                                moves++;
                                
                                // 更新UI
                                updateUI();
                                
                                // 检查匹配
                                checkMatch(scene);
                            }
                        }
                    });
                }
            });
        }
        
        // 检查卡牌是否匹配
        function checkMatch(scene) {
            const card1 = flippedCards[0];
            const card2 = flippedCards[1];
            
            // 如果卡牌值相同，则匹配成功
            if (card1.getData('value') === card2.getData('value')) {
                // 播放匹配声音
                matchSound.play();
                
                // 标记卡牌为已匹配
                card1.setData('matched', true);
                card2.setData('matched', true);
                
                // 增加匹配计数
                totalMatches++;
                
                // 计算得分
                score += 100;
                
                // 更新UI
                updateUI();
                
                // 清空已翻转卡牌数组
                flippedCards = [];
                
                // 检查游戏是否结束
                if (totalMatches === (gridSize * gridSize) / 2) {
                    endGame(scene);
                } else {
                    canFlip = true;
                }
            } else {
                // 不匹配，翻转回去
                scene.time.delayedCall(1000, function() {
                    // 翻转第一张卡牌回去
                    scene.tweens.add({
                        targets: card1,
                        scaleX: 0,
                        duration: 150,
                        onComplete: function() {
                            card1.setTexture('cardBack');
                            scene.tweens.add({
                                targets: card1,
                                scaleX: 1,
                                duration: 150
                            });
                        }
                    });
                    
                    // 翻转第二张卡牌回去
                    scene.tweens.add({
                        targets: card2,
                        scaleX: 0,
                        duration: 150,
                        onComplete: function() {
                            card2.setTexture('cardBack');
                            scene.tweens.add({
                                targets: card2,
                                scaleX: 1,
                                duration: 150,
                                onComplete: function() {
                                    // 重置卡牌状态
                                    card1.setData('flipped', false);
                                    card2.setData('flipped', false);
                                    
                                    // 清空已翻转卡牌数组
                                    flippedCards = [];
                                    
                                    // 允许再次翻转
                                    canFlip = true;
                                }
                            });
                        }
                    });
                });
            }
        }
        
        // 结束游戏
        function endGame(scene) {
            gameActive = false;
            
            // 播放胜利声音
            winSound.play();
            
            // 计算最终得分（时间越短，步数越少，得分越高）
            const timeBonus = Math.max(0, 300 - gameTime) * 5;
            const movesBonus = Math.max(0, 50 - moves) * 10;
            score += timeBonus + movesBonus;
            
            // 更新UI
            updateUI();
            
            // 显示胜利消息
            const victoryText = scene.add.text(
                scene.game.config.width / 2,
                scene.game.config.height / 2,
                '恭喜！游戏完成！',
                {
                    fontFamily: 'Arial',
                    fontSize: '48px',
                    color: '#FFD700',
                    stroke: '#000',
                    strokeThickness: 6
                }
            ).setOrigin(0.5);
            
            const statsText = scene.add.text(
                scene.game.config.width / 2,
                scene.game.config.height / 2 + 60,
                `步数: ${moves} | 时间: ${gameTime}秒 | 得分: ${score}`,
                {
                    fontFamily: 'Arial',
                    fontSize: '24px',
                    color: '#FFFFFF',
                    stroke: '#000',
                    strokeThickness: 4
                }
            ).setOrigin(0.5);
            
            // 添加动画效果
            scene.tweens.add({
                targets: [victoryText, statsText],
                y: '-=50',
                alpha: 0,
                duration: 3000,
                ease: 'Power2',
                onComplete: function() {
                    victoryText.destroy();
                    statsText.destroy();
                }
            });
        }
        
        // 更新游戏UI
        function update() {
            if (gameActive) {
                gameTime = Math.floor((this.time.now - startTime) / 1000);
                document.getElementById('time').textContent = gameTime;
            }
        }
        
        // 更新UI显示
        function updateUI() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = totalMatches;
            document.getElementById('score').textContent = score;
            
            // 更新时间显示
            if (gameActive) {
                document.getElementById('time').textContent = gameTime;
            }
        }
        
        // 打乱数组（洗牌算法）
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    </script>
</body>
</html>
